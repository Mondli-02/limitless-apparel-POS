<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Limitless Apparel - Login</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="icons/ui/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/ui/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/ui/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/ui/apple-touch-icon.png"
    />

    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="logo">
          <!-- Limitless Apparel Logo -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="384 1093.59 1710.31 1320.37"
            style="
              shape-rendering: geometricPrecision;
              text-rendering: geometricPrecision;
              image-rendering: optimizeQuality;
              fill-rule: evenodd;
              clip-rule: evenodd;
            "
          >
            <g>
              <path
                fill="white"
                d="M1361.02 2230.36l0.45 -18.58 9.07 -234.56c-33.54,-0.13 -7.86,2.4 -40.66,87.35 -40.41,104.65 -125.01,144.31 -248.18,144.46 -85.33,0.11 -159.81,-11.56 -204.68,-56.04 -51.76,-51.31 -47.98,-453.77 -45.56,-545.17l-149.77 -0.25c0.21,64.97 6.42,481.13 -16.03,532.01 -11.99,27.18 -28.75,41.87 -51.72,55.12 -9.37,5.41 -25.08,11.64 -38.37,15.14 -39.66,10.45 -36.91,-3.44 -38.31,20.43l823.76 0.09z"
              />
              <path
                fill="white"
                d="M537.86 1296.2c4.78,8.73 -0.87,3.02 8.75,6.38 0.98,0.34 10.74,1.73 12.59,1.99 53.17,7.58 92.63,34.2 110.54,89.22 21.21,65.18 6.68,165.01 12.78,235.68l147.91 -0.35c10.97,-113.42 -44,-299.46 124.96,-323.64 14.35,-2.06 22.21,1.47 22.36,-9.37 0.16,-12.6 -20.54,-7.26 -49.62,-7.01 -19.04,0.16 -38.1,0.72 -57.14,1.22 -113.18,2.96 -196.46,1.62 -307.35,-1.43 -35.8,-0.99 -20.79,2.52 -25.78,7.31z"
              />
              <g>
                <path
                  fill="#FF0508"
                  d="M1691.04 1934.82l0 0 -156.07 -12.43c14.62,37.37 68.88,157.54 75.17,185.85 15.58,70.07 -41.48,101.92 -102.02,107.42 -16.59,1.5 -18.66,-3.23 -24.09,8.03 1.62,4.38 -3.57,7.54 20.88,7.62l86.12 -0.4c26.51,-0.01 336.66,4.87 350.03,-3.66 -6.4,-25.71 -26.36,6.42 -88.24,-33.22 -24.16,-15.47 -46.72,-40.14 -61.51,-63.37 -39.34,-61.8 -49.28,-111.38 -72.67,-159.19l-27.6 -36.65z"
                />
                <path
                  fill="#FF0508"
                  d="M1138.38 1937.01l27.78 -0.49c9.93,-26.24 149.79,-376.5 159.09,-402.46 8.05,-22.48 19.15,-56.22 29.64,-73.05 21.01,20 168.39,449.54 186.44,473.85l177.81 37.62c-4.57,-20.57 -278.87,-661.75 -292.28,-697.22l-25.16 0.06 -263.32 661.69z"
                />
                <path
                  fill="#FF0508"
                  d="M928.03 2212.29l-0.45 18.59c37.52,0.17 296.81,4.76 308.21,-3.63 -4.01,-14.3 -9.31,-7.76 -36.79,-15.21 -14.65,-3.98 -28.22,-11.21 -38.48,-18.42 -89.94,-63.23 -8.96,-196.08 5.64,-257.1l-27.53 -0.13c-8.06,26.46 -24.18,59.72 -35.05,85.99 -28.86,69.75 -82.95,194.97 -175.55,189.91z"
                />
                <rect
                  fill="#FF0508"
                  x="1143.02"
                  y="1931.16"
                  width="465.76"
                  height="17.97"
                />
              </g>
            </g>
          </svg>
        </div>
        <h1 class="login-title">Limitless Apparel</h1>
        <p class="login-subtitle">Men's Fashion POS System</p>
      </div>

      <div class="login-body">
        <!-- Alert Messages -->
        <div class="alert alert-error" id="errorAlert">
          <svg
            class="alert-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span id="errorMessage">Invalid email or password</span>
        </div>

        <div class="alert alert-success" id="successAlert">
          <svg
            class="alert-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span id="successMessage">Login successful!</span>
        </div>

        <!-- Role Selector -->
        <div class="role-selector">
          <div class="role-card active" data-role="shopkeeper">
            <div class="role-icon">
              <svg
                width="24"
                height="24"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
                />
              </svg>
            </div>
            <div class="role-name">Shopkeeper</div>
          </div>
          <div class="role-card" data-role="manager">
            <div class="role-icon">
              <svg
                width="24"
                height="24"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                />
              </svg>
            </div>
            <div class="role-name">Manager</div>
          </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-wrapper">
              <svg
                class="input-icon"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                />
              </svg>
              <input
                type="email"
                class="form-input"
                id="emailInput"
                placeholder="you@example.com"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-wrapper">
              <svg
                class="input-icon"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                />
              </svg>
              <input
                type="password"
                class="form-input"
                id="passwordInput"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" id="togglePassword">
                <svg
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-footer">
            <label class="remember-me">
              <input type="checkbox" class="checkbox" id="rememberMe" />
              <span class="checkbox-label">Remember me</span>
            </label>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span id="btnText">Sign In</span>
            <svg
              id="btnArrow"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M14 5l7 7m0 0l-7 7m7-7H3"
              />
            </svg>
            <div class="spinner" id="btnSpinner" style="display: none"></div>
          </button>
        </form>
      </div>

      <div class="login-footer">Limitless Apparel 2025 &copy;.</div>
    </div>
    <script type="module">
      import { supabase } from "./js/supabase-client.js";

      window.addEventListener("DOMContentLoaded", async () => {
        console.log("Testing Supabase connection...");
        const { data, error } = await supabase
          .from("users")
          .select("count")
          .limit(1);

        if (error) {
          console.error("Supabase connection failed:", error);
        } else {
          console.log("Supabase connection successful!", data);
        }
      });

      import { authManager } from "./js/auth.js";

      let selectedRole = "shopkeeper";

      document.querySelectorAll(".role-card").forEach((card) => {
        card.addEventListener("click", function () {
          document
            .querySelectorAll(".role-card")
            .forEach((c) => c.classList.remove("active"));
          this.classList.add("active");
          selectedRole = this.dataset.role;
          console.log("Role selected:", selectedRole);
        });
      });

      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("passwordInput");

      togglePassword.addEventListener("click", function () {
        const type = passwordInput.type === "password" ? "text" : "password";
        passwordInput.type = type;
      });

      function showAlert(type, message) {
        const errorAlert = document.getElementById("errorAlert");
        const successAlert = document.getElementById("successAlert");

        errorAlert.classList.remove("show");
        successAlert.classList.remove("show");

        if (type === "error") {
          document.getElementById("errorMessage").textContent = message;
          errorAlert.classList.add("show");
        } else {
          document.getElementById("successMessage").textContent = message;
          successAlert.classList.add("show");
        }

        setTimeout(() => {
          errorAlert.classList.remove("show");
          successAlert.classList.remove("show");
        }, 5000);
      }

      const loginForm = document.getElementById("loginForm");
      const loginBtn = document.getElementById("loginBtn");
      const btnText = document.getElementById("btnText");
      const btnArrow = document.getElementById("btnArrow");
      const btnSpinner = document.getElementById("btnSpinner");

      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        console.log("Form submitted");

        const email = document.getElementById("emailInput").value;
        const password = document.getElementById("passwordInput").value;
        const rememberMe = document.getElementById("rememberMe").checked;

        console.log("Login attempt:", { email, selectedRole, rememberMe });

        loginBtn.disabled = true;
        btnText.textContent = "Signing in...";
        btnArrow.style.display = "none";
        btnSpinner.style.display = "block";

        try {
          console.log("Calling authManager.login...");
          const result = await authManager.login(email, password, selectedRole);
          console.log("Login result:", result);

          if (result.success) {
            console.log("Login successful, showing success message");
            showAlert("success", "Login successful! Redirecting...");

            if (rememberMe) {
              localStorage.setItem("remember_me", "true");
            } else {
              sessionStorage.setItem("session_only", "true");
            }

            console.log("Starting redirect timer...");
            setTimeout(() => {
              console.log("Redirect timer fired. Role:", selectedRole);
              if (selectedRole === "manager") {
                console.log("Redirecting to admin.html");
                window.location.href = "admin.html";
              } else {
                console.log("Redirecting to pos.html");
                window.location.href = "pos.html";
              }
            }, 1500);
          } else {
            console.log("Login failed:", result.error);
            showAlert("error", result.error || "Login failed");
            resetButton();
          }
        } catch (error) {
          console.error("Login catch error:", error);
          showAlert("error", error.message || "An error occurred during login");
          resetButton();
        }
      });

      function resetButton() {
        loginBtn.disabled = false;
        btnText.textContent = "Sign In";
        btnArrow.style.display = "block";
        btnSpinner.style.display = "none";
      }

      window.addEventListener("DOMContentLoaded", async function () {
        console.log("DOM loaded, checking for existing session...");
        const hasSession = await authManager.init();
        console.log("Session check result:", hasSession);

        if (hasSession) {
          console.log("Has session, getting user role...");
          const userRole = await authManager.getCurrentUserRole();
          console.log("User role:", userRole);

          if (userRole) {
            console.log("User already logged in, redirecting...");
            if (userRole === "manager") {
              window.location.href = "admin.html";
            } else {
              window.location.href = "pos.html";
            }
          }
        } else {
          console.log("No existing session found");
        }
      });
    </script>
  </body>
</html>
